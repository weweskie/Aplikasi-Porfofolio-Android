plugins {
    id 'com.android.application'
}

android {
    namespace 'com.investtrack.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.investtrack.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Standalone WebView does not require external heavyweight libraries
}
